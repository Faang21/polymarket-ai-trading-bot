name: Polymarket AI Trading Bot Cron Runner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Polymarket Bot Engine
        env:
          GEMINI_API_KEY: "AQ.Ab8RN6Ieg8z8MtM1DyT6Wfg22XHQaAeRwS4avx6-nzWsLrH8cw"
          PRIVATE_KEY_BURNER: "06133b641e505538421c74c5355e19cb497f572dbb233b582972e535c2a0bb19"
          CLOUDFLARE_KV_URL: "https://bot-control.aangcrypto21.workers.dev/status"
        run: |
          python backend/main_bot.py

      - name: Commit and Push Updated Simulation CSV
        run: |
          git config --global user.name 'polymarket-bot-ci'
          git config --global user.email 'bot@polymarket-ai.internal'
          git add catatan_simulasi_polymarket.csv || true
          if git status --porcelain | grep -q 'catatan_simulasi_polymarket.csv'; then
            git commit -m "auto: update catatan_simulasi_polymarket.csv [skip ci]"
            git push
          else
            echo "No changes in catatan_simulasi_polymarket.csv to commit."
          fi
